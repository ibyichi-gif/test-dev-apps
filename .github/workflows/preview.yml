name: Validate static files

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List apps
        run: |
          echo "=== apps/ ==="
          ls -la apps/ || true
          echo "=== root ==="
          ls -la
      - name: Check index.html exists
        run: test -f index.html
