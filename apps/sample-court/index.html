<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アプリ確認 — Sample</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    background: #f5f4f0;
    color: #1a1a1a;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .back {
    display: inline-block;
    font-size: 13px;
    color: #6b6b6b;
    text-decoration: none;
    margin-bottom: 14px;
  }
  .back:hover { color: #1a1a1a; }
  .card {
    background: #fff;
    border-radius: 12px;
    border: 0.5px solid rgba(0,0,0,0.1);
    padding: 20px;
    margin-bottom: 14px;
  }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #6b6b6b; margin-bottom: 14px; }
  .check-list { list-style: none; padding: 0; }
  .check-list li {
    padding: 10px 12px;
    background: #f5f4f0;
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ok { color: #1D9E75; font-weight: 600; }
  .info { color: #185FA5; font-weight: 600; }
  code {
    font-family: Menlo, Monaco, Consolas, monospace;
    background: rgba(0,0,0,0.05);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../../index.html">← Court に戻る</a>
  <div class="card">
    <h1>🏐 アプリ確認</h1>
    <p class="sub">この画面が見えていれば、ギャラリーからの遷移とデプロイは正常です。</p>
    <ul class="check-list">
      <li><span class="ok">OK</span> HTML が読み込まれている</li>
      <li><span class="ok">OK</span> CSS が適用されている</li>
      <li><span class="info">i</span> パス：<code>apps/sample-court/index.html</code></li>
      <li><span class="info">i</span> 新しいアプリは <code>apps/&lt;name&gt;/index.html</code> に配置</li>
      <li><span class="info">i</span> ギャラリー側 <code>index.html</code> の <code>apps</code> 配列に追加で表示される</li>
    </ul>
  </div>
</div>
</body>
</html>
