<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   3D VOLLEYBALL VIEW
   - Renders one selected pattern in 3D
   - Court is 9m × 18m (real proportions); we map SVG coords to world
   - Camera presets: overhead, attacker POV, blocker POV, baseline, side
============================================================ */

const COURT = window._volleyCourt;
const DEFAULT_ARC = window._volleyDefaultArc;
const overlay = document.getElementById('view3dOverlay');
const canvasWrap = document.getElementById('view3dCanvasWrap');
const patternNameEl = document.getElementById('view3dPatternName');
const btnExit = document.getElementById('btnExit3d');

let scene, camera, renderer, controls;
let currentIdx = -1;
let animationId = null;

// References for live update
let ballMesh = null;
let ballPole = null;       // dashed vertical line under ball
const courseObjects = [];  // Array of {tube, ring, fan, courseIdx}

// World scale (小学生バレー): court 16m × 8m, net 2.00m, attack line 2.7m
// 1 SVG unit ≈ 8/280 m ≈ 0.0286 m
// We'll use meters directly and convert SVG -> world
const COURT_WORLD = {
  width: 8,      // x (横8m)
  length: 16,    // z (縦16m, along net direction)
  netHeight: 2.00,         // 小学生男女共通
  attackLineFromNet: 2.7,  // 小学生は2.7m(一般3mより短い)
};

function svgToWorld(sx, sy) {
  // Court center in SVG is ((ourLeft+ourRight)/2, (oppTop+ourBottom)/2)
  const cx = (COURT.ourLeft + COURT.ourRight) / 2;
  const cz = (COURT.oppTop + COURT.ourBottom) / 2;
  // SVG: x grows right, y grows down
  // World: x = SVG x mapped to court width, z = SVG y mapped to court length
  const courtSvgW = COURT.ourRight - COURT.ourLeft;       // 280
  const courtSvgL = COURT.ourBottom - COURT.oppTop;       // 360
  const wx = ((sx - cx) / courtSvgW) * COURT_WORLD.width;
  const wz = ((sy - cz) / courtSvgL) * COURT_WORLD.length;
  return { x: wx, z: wz };
}

function buildScene(pattern) {
  // Clean up previous scene
  cleanupScene();

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0e14);
  scene.fog = new THREE.Fog(0x0a0e14, 25, 80);

  // Camera
  const w = canvasWrap.clientWidth;
  const h = canvasWrap.clientHeight;
  camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 200);
  camera.position.set(15, 12, 15);

  // Renderer
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(w, h);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  // Remove old canvas if any
  while (canvasWrap.firstChild && canvasWrap.firstChild.tagName === 'CANVAS') {
    canvasWrap.removeChild(canvasWrap.firstChild);
  }
  canvasWrap.insertBefore(renderer.domElement, canvasWrap.firstChild);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 1, 0);
  controls.minDistance = 3;
  controls.maxDistance = 60;
  controls.maxPolarAngle = Math.PI * 0.49; // can't go below floor

  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.45);
  scene.add(ambient);
  const dir = new THREE.DirectionalLight(0xffffff, 0.85);
  dir.position.set(8, 18, 6);
  dir.castShadow = true;
  dir.shadow.mapSize.set(1024, 1024);
  dir.shadow.camera.left = -15;
  dir.shadow.camera.right = 15;
  dir.shadow.camera.top = 15;
  dir.shadow.camera.bottom = -15;
  scene.add(dir);
  // Subtle backlight
  const fill = new THREE.DirectionalLight(0xa0b8d8, 0.25);
  fill.position.set(-8, 10, -8);
  scene.add(fill);

  // Floor (gym floor)
  const floorGeo = new THREE.PlaneGeometry(40, 50);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1410, roughness: 0.95 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Court
  buildCourt3D(scene);

  // Net
  buildNet3D(scene);

  // Players (our + opp)
  pattern.ourPlayers.forEach(p => {
    const isAttacker = p.id === pattern.attackerId;
    const w = svgToWorld(p.x, p.y);
    const hCm = (typeof p.heightCm === 'number') ? p.heightCm : defaultHeightFor(p.id);
    addPlayer3D(scene, w.x, w.z, isAttacker ? 0xef5b3b : 0xf4a72a, p.label, isAttacker, false, hCm);
  });
  pattern.oppPlayers.forEach(p => {
    const w = svgToWorld(p.x, p.y);
    const hCm = (typeof p.heightCm === 'number') ? p.heightCm : 150;
    addPlayer3D(scene, w.x, w.z, 0x4d6a8a, p.label, false, true, hCm);
  });

  // Ball
  if (pattern.ball.visible) {
    const w = svgToWorld(pattern.ball.x, pattern.ball.y);
    const ballH = (typeof pattern.ball.h === 'number') ? pattern.ball.h : 2.5;
    addBall3D(scene, w.x, ballH, w.z);

    // Courses
    pattern.courses.forEach((c, ci) => {
      const target = svgToWorld(c.x2, c.y2);
      const arcH = (typeof c.arcHeight === 'number') ? c.arcHeight : (DEFAULT_ARC[c.type] ?? 0);
      addCourse3D(scene, w.x, ballH, w.z, target.x, target.z, c.type || 'strike', pattern.halfAngle, arcH, ci);
    });
  }

  return { scene, camera, renderer, controls };
}

function buildCourt3D(scene) {
  // Court surface
  const courtGeo = new THREE.PlaneGeometry(COURT_WORLD.width, COURT_WORLD.length);
  const courtMat = new THREE.MeshStandardMaterial({ color: 0x0f3a2e, roughness: 0.85 });
  const court = new THREE.Mesh(courtGeo, courtMat);
  court.rotation.x = -Math.PI / 2;
  court.position.y = 0.005;
  court.receiveShadow = true;
  scene.add(court);

  // Lines
  const lineMat = new THREE.LineBasicMaterial({ color: 0xf5f0e1 });
  const halfW = COURT_WORLD.width / 2;
  const halfL = COURT_WORLD.length / 2;
  const y = 0.01;

  // Outline
  const outline = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-halfW, y, -halfL),
    new THREE.Vector3( halfW, y, -halfL),
    new THREE.Vector3( halfW, y,  halfL),
    new THREE.Vector3(-halfW, y,  halfL),
    new THREE.Vector3(-halfW, y, -halfL),
  ]);
  scene.add(new THREE.Line(outline, lineMat));

  // Center line (under net)
  const center = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-halfW, y, 0),
    new THREE.Vector3( halfW, y, 0),
  ]);
  scene.add(new THREE.Line(center, lineMat));

  // Attack lines (小学生は2.7m from net on each side)
  const aLine = COURT_WORLD.attackLineFromNet;
  const attLineMat = new THREE.LineDashedMaterial({ color: 0x5e8579, dashSize: 0.3, gapSize: 0.2 });
  const att1 = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-halfW, y, -aLine),
    new THREE.Vector3( halfW, y, -aLine),
  ]);
  const att1Line = new THREE.Line(att1, attLineMat);
  att1Line.computeLineDistances();
  scene.add(att1Line);

  const att2 = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-halfW, y,  aLine),
    new THREE.Vector3( halfW, y,  aLine),
  ]);
  const att2Line = new THREE.Line(att2, attLineMat);
  att2Line.computeLineDistances();
  scene.add(att2Line);
}

function buildNet3D(scene) {
  // Net posts
  const postGeo = new THREE.CylinderGeometry(0.06, 0.06, COURT_WORLD.netHeight + 0.5, 12);
  const postMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.6, roughness: 0.4 });
  const halfW = COURT_WORLD.width / 2;
  const post1 = new THREE.Mesh(postGeo, postMat);
  post1.position.set(-halfW - 0.3, (COURT_WORLD.netHeight + 0.5) / 2, 0);
  post1.castShadow = true;
  scene.add(post1);
  const post2 = post1.clone();
  post2.position.x = halfW + 0.3;
  scene.add(post2);

  // Net (semitransparent plane with grid texture using a canvas)
  const netCanvas = document.createElement('canvas');
  netCanvas.width = 256; netCanvas.height = 64;
  const ctx = netCanvas.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, 256, 64);
  ctx.strokeStyle = '#d8d3c0';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 256; i += 8) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 64); ctx.stroke();
  }
  for (let j = 0; j <= 64; j += 8) {
    ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(256, j); ctx.stroke();
  }
  // Top white band
  ctx.fillStyle = '#f5f0e1';
  ctx.fillRect(0, 0, 256, 5);
  ctx.fillRect(0, 59, 256, 5);

  const netTex = new THREE.CanvasTexture(netCanvas);
  netTex.wrapS = THREE.RepeatWrapping;
  netTex.repeat.x = 1;
  const netMat = new THREE.MeshBasicMaterial({
    map: netTex,
    transparent: true,
    side: THREE.DoubleSide,
    alphaTest: 0.05,
  });
  const netGeo = new THREE.PlaneGeometry(COURT_WORLD.width + 0.6, 1.0);
  const net = new THREE.Mesh(netGeo, netMat);
  net.position.set(0, COURT_WORLD.netHeight - 0.5, 0);
  scene.add(net);
}

function addPlayer3D(scene, x, z, color, label, isAttacker, isOpp = false, heightCm = 150) {
  const group = new THREE.Group();
  // 実寸プロポーション (小学生想定)
  // 身長 totalH (m), 頭半径 ≈ totalH * 0.07 (頭身~7身), 肩幅 ≈ totalH * 0.23
  // 胴(脚含む) = 頭頂下から地面まで (totalH - headDiameter)
  const totalH = heightCm / 100;                       // m
  const headR = Math.max(0.07, totalH * 0.067);        // ~10cm @150cm
  const shoulderR = Math.max(0.13, totalH * 0.115);    // 肩半径 (≒肩幅/2)
  const hipR = shoulderR * 0.92;                       // 腰側はわずかに細く
  const bodyH = totalH - headR * 2;                    // 体高 = 全身 - 頭直径
  const bodyCenterY = bodyH / 2;
  const headCenterY = bodyH + headR;

  // Body (cylinder) — 肩〜地面
  const bodyGeo = new THREE.CylinderGeometry(shoulderR, hipR, bodyH, 16);
  const bodyMat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = bodyCenterY;
  body.castShadow = true;
  group.add(body);
  // Head (sphere)
  const headGeo = new THREE.SphereGeometry(headR, 16, 12);
  const headMat = new THREE.MeshStandardMaterial({ color: 0xf5d8b8, roughness: 0.6 });
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = headCenterY;
  head.castShadow = true;
  group.add(head);
  // Glow ring under attacker
  if (isAttacker) {
    const ringGeo = new THREE.RingGeometry(shoulderR + 0.08, shoulderR + 0.18, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xef5b3b, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.02;
    group.add(ring);
  }
  // Label sprite — 身長(cm)も併記
  const sprite = makeTextSprite(`${label} ${heightCm}`);
  sprite.position.y = totalH + 0.22;
  // ラベル幅は全身の40%程度に縮小
  sprite.scale.set(0.55, 0.18, 1);
  group.add(sprite);

  group.position.set(x, 0, z);
  scene.add(group);
}

function makeTextSprite(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(10,14,20,0.85)';
  ctx.fillRect(0, 0, 128, 64);
  ctx.strokeStyle = '#f4a72a';
  ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, 126, 62);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 32);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(0.8, 0.4, 1);
  return sprite;
}

function addBall3D(scene, x, y, z) {
  // 小学生バレー4号球: 円周62-64cm → 半径 ≈ 0.10m
  const BALL_RADIUS = 0.101;  // 円周63.5cm相当
  const geo = new THREE.SphereGeometry(BALL_RADIUS, 24, 18);
  const mat = new THREE.MeshStandardMaterial({ color: 0xfff2c4, roughness: 0.4, emissive: 0x554a30, emissiveIntensity: 0.3 });
  const ball = new THREE.Mesh(geo, mat);
  ball.position.set(x, y, z);
  ball.castShadow = true;
  scene.add(ball);
  ballMesh = ball;
  // Cast a faint vertical line down to the floor (so 3D position is clear)
  const lineGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x, 0.01, z),
    new THREE.Vector3(x, y, z),
  ]);
  const lineMat = new THREE.LineDashedMaterial({ color: 0xfff2c4, dashSize: 0.15, gapSize: 0.1, opacity: 0.5, transparent: true });
  const line = new THREE.Line(lineGeo, lineMat);
  line.computeLineDistances();
  scene.add(line);
  ballPole = line;
}

function addCourse3D(scene, bx, by, bz, tx, tz, type, halfAngleDeg, arcHeight, courseIdx) {
  // Target lands on the court (y=0)
  const targetY = 0.05;
  const colorHex = {
    strike: 0xff5f4a,
    block:  0xffd84d,
    loop:   0xb876ff,
    feint:  0x58d3ff,
  }[type] || 0xff5f4a;

  const dx = tx - bx, dz = tz - bz;
  const horizDist = Math.sqrt(dx*dx + dz*dz);

  // Build trajectory points
  // Base trajectory: parabolic from (bx, by, bz) to (tx, targetY, tz)
  // Peak height = midpoint elevation between by and targetY, plus arcHeight bump above the chord
  const segments = 32;
  const points = [];

  // The "chord" goes linearly from start height by to end height targetY
  // We add a parabolic bump that peaks at midpoint with magnitude = arcHeight
  // Special: for 'block' type, also add a small lateral wobble (deflection feel)
  let lateralWobble = 0;
  if (type === 'block') lateralWobble = 0.25;

  // Perpendicular in XZ plane (for wobble)
  let px = 0, pz = 0;
  if (horizDist > 0.001) {
    const ux = dx / horizDist, uz = dz / horizDist;
    px = -uz; pz = ux;
  }

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    // Linear interpolation in XZ
    const x = bx + dx * t;
    const z = bz + dz * t;
    // Height: linear chord + parabolic bump
    const chord = by * (1 - t) + targetY * t;
    const bump = 4 * t * (1 - t) * arcHeight; // peaks at t=0.5 with value = arcHeight
    let y = chord + bump;
    // Block wobble (lateral)
    let xx = x, zz = z;
    if (lateralWobble > 0) {
      const wob = Math.sin(t * Math.PI * 4) * lateralWobble * (1 - t * 0.6);
      xx += px * wob;
      zz += pz * wob;
    }
    points.push(new THREE.Vector3(xx, y, zz));
  }

  // Build tube geometry along curve for visibility
  const curve = new THREE.CatmullRomCurve3(points);
  const tubeGeo = new THREE.TubeGeometry(curve, 40, 0.04, 8, false);
  const tubeMat = new THREE.MeshStandardMaterial({
    color: colorHex,
    emissive: colorHex,
    emissiveIntensity: 0.55,
    roughness: 0.3,
    transparent: true,
    opacity: 1.0,
  });
  const tube = new THREE.Mesh(tubeGeo, tubeMat);
  scene.add(tube);

  // Landing marker on the floor
  const ringGeo = new THREE.RingGeometry(0.12, 0.22, 24);
  const ringMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(tx, 0.02, tz);
  scene.add(ring);

  // Fan area on the floor (the "possible landing range")
  const fan = buildFanFloor3D(scene, bx, bz, tx, tz, halfAngleDeg, colorHex, type);

  // Course number badge — small sprite floating above the landing point
  // Visible enough to identify the course, but small to avoid clutter
  const badge = makeCourseBadge(courseIdx + 1, type, colorHex);
  badge.position.set(tx, 0.85, tz);
  scene.add(badge);

  // Register for live updates (with material refs for highlight/dim)
  courseObjects.push({ tube, tubeGeo, ring, ringMat, fan, badge, courseIdx, colorHex, type });
}

// Small color-coded badge sprite shown at landing point: "#1 強打"
function makeCourseBadge(num, type, colorHex) {
  const labels = { strike: '強打', block: 'ワンタッチ', loop: 'ループ', feint: 'フェイント' };
  const text = `#${num} ${labels[type] || ''}`;
  const canvas = document.createElement('canvas');
  canvas.width = 192; canvas.height = 56;
  const ctx = canvas.getContext('2d');
  // Background pill
  const colorCss = '#' + colorHex.toString(16).padStart(6, '0');
  ctx.fillStyle = 'rgba(10,14,20,0.85)';
  roundRect(ctx, 1, 1, 190, 54, 12, true, false);
  ctx.lineWidth = 2;
  ctx.strokeStyle = colorCss;
  roundRect(ctx, 1, 1, 190, 54, 12, false, true);
  // Text
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px "Noto Sans JP", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 96, 30);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.55, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(0.95, 0.28, 1);
  sprite.userData.baseOpacity = 0.55;
  return sprite;
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

// Highlight the selected course; dim the others. Pass -1 to clear (all visible).
function highlightSelectedCourse(selectedIdx) {
  courseObjects.forEach(co => {
    const isSel = (co.courseIdx === selectedIdx);
    // Tube: bright vs dim
    if (co.tube && co.tube.material) {
      co.tube.material.opacity = isSel ? 1.0 : (selectedIdx < 0 ? 1.0 : 0.22);
      co.tube.material.emissiveIntensity = isSel ? 1.1 : 0.4;
    }
    // Ring on floor
    if (co.ringMat) {
      co.ringMat.opacity = isSel ? 1.0 : (selectedIdx < 0 ? 0.9 : 0.25);
    }
    // Fan polygon (semi-transparent)
    if (co.fan && co.fan.material) {
      co.fan.material.opacity = isSel ? 0.32 : (selectedIdx < 0 ? 0.18 : 0.06);
    }
    // Badge: selected = full bright + slightly larger; others = faint
    if (co.badge && co.badge.material) {
      const base = co.badge.userData.baseOpacity ?? 0.55;
      co.badge.material.opacity = isSel ? 1.0 : (selectedIdx < 0 ? base : 0.2);
      const s = isSel ? 1.15 : 1.0;
      co.badge.scale.set(0.95 * s, 0.28 * s, 1);
    }
  });
}

function buildFanFloor3D(scene, bx, bz, tx, tz, halfAngleDeg, color, type) {
  const dx = tx - bx, dz = tz - bz;
  const baseAngle = Math.atan2(dz, dx);
  const half = halfAngleDeg * Math.PI / 180;
  let len = Math.sqrt(dx*dx + dz*dz);
  if (type === 'feint') len *= 0.7;

  // Create a flat fan-shaped plane on the floor
  const segments = 32;
  const vertices = [];
  const indices = [];
  // Center vertex at ball horizontal projection
  vertices.push(bx, 0.015, bz);
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const a = baseAngle - half + t * (2 * half);
    vertices.push(bx + Math.cos(a) * len, 0.015, bz + Math.sin(a) * len);
  }
  for (let i = 1; i <= segments; i++) {
    indices.push(0, i, i + 1);
  }
  const fanGeo = new THREE.BufferGeometry();
  fanGeo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  fanGeo.setIndex(indices);
  fanGeo.computeVertexNormals();
  const fanMat = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.18,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
  const fan = new THREE.Mesh(fanGeo, fanMat);
  scene.add(fan);
  return fan;
}

// ---------- CAMERA PRESETS ----------
function applyCameraPreset(name, pattern) {
  if (!camera || !controls) return;

  // Find attacker world position
  const attacker = pattern.ourPlayers.find(p => p.id === pattern.attackerId);
  const attackerW = attacker ? svgToWorld(attacker.x, attacker.y) : { x: 0, z: 5 };

  // Find a generic blocker (front-court opp player closest to net)
  let blocker = pattern.oppPlayers[0];
  let minDist = Infinity;
  pattern.oppPlayers.forEach(p => {
    const w = svgToWorld(p.x, p.y);
    const d = Math.abs(w.z); // closest to net (z=0)
    if (d < minDist) { minDist = d; blocker = p; }
  });
  const blockerW = svgToWorld(blocker.x, blocker.y);

  switch (name) {
    case 'overhead':
      camera.position.set(0, 22, 0.01);
      controls.target.set(0, 0, 0);
      break;
    case 'attacker':
      // Behind attacker, looking toward opponent court
      camera.position.set(attackerW.x, 2.2, attackerW.z + 1.5);
      controls.target.set(attackerW.x * 0.3, 1.5, -2);
      break;
    case 'blocker':
      // Behind blocker (on opp side), looking toward our court
      camera.position.set(blockerW.x, 2.5, blockerW.z - 1.5);
      controls.target.set(blockerW.x * 0.3, 1.5, 3);
      break;
    case 'baseline':
      // Far end of our side, looking forward
      camera.position.set(0, 2.5, 11);
      controls.target.set(0, 1, 0);
      break;
    case 'side':
      // Sideline view
      camera.position.set(14, 4.5, 0);
      controls.target.set(0, 1.5, 0);
      break;
  }

  // Highlight active button
  document.querySelectorAll('.cam-preset').forEach(b => {
    b.classList.toggle('active', b.dataset.cam === name);
  });

  controls.update();
}

// ---------- LIFECYCLE ----------
function cleanupScene() {
  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }
  // Clear references
  ballMesh = null;
  ballPole = null;
  courseObjects.length = 0;
  if (renderer) {
    renderer.dispose();
    if (renderer.domElement && renderer.domElement.parentNode) {
      renderer.domElement.parentNode.removeChild(renderer.domElement);
    }
    renderer = null;
  }
  if (scene) {
    scene.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
        else obj.material.dispose();
      }
    });
    scene = null;
  }
  controls = null;
  camera = null;
}

function animate() {
  animationId = requestAnimationFrame(animate);
  if (controls) controls.update();
  if (renderer && scene && camera) renderer.render(scene, camera);
}

function onResize() {
  if (!renderer || !camera) return;
  const w = canvasWrap.clientWidth;
  const h = canvasWrap.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

// ---------- LIVE SLIDER UPDATES ----------
const ballHeightSlider = document.getElementById('ballHeightSlider');
const ballHeightVal = document.getElementById('ballHeightVal');
const courseSelect = document.getElementById('courseSelect');
const arcSlider = document.getElementById('arcSlider');
const arcVal = document.getElementById('arcVal');

function initSliders(pattern) {
  // Ball height
  const h = (typeof pattern.ball.h === 'number') ? pattern.ball.h : 2.5;
  ballHeightSlider.value = h;
  ballHeightVal.textContent = h.toFixed(2) + ' m';

  // Course list
  courseSelect.innerHTML = '<option value="-1">-- なし --</option>';
  pattern.courses.forEach((c, i) => {
    const labels = { strike: '強打', block: 'ワンタッチ', loop: 'ループ', feint: 'フェイント' };
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `#${i + 1} ${labels[c.type] || '?'}`;
    courseSelect.appendChild(opt);
  });

  // Auto-select first course if any
  if (pattern.courses.length > 0) {
    courseSelect.value = '0';
    syncArcSliderToCourse(0, pattern);
    highlightSelectedCourse(0);
  } else {
    courseSelect.value = '-1';
    arcSlider.disabled = true;
    arcSlider.value = 0;
    arcVal.textContent = '— —';
    highlightSelectedCourse(-1);
  }
}

// ---------- HEIGHTS PANEL ----------
const heightsGrid = document.getElementById('heightsGrid');

function renderHeightsPanel(pattern) {
  if (!heightsGrid) return;
  heightsGrid.innerHTML = '';
  const order = ['L','C','R','S','LB','RB'];
  // pattern.ourPlayers をid順に並べ替え
  const sorted = [...pattern.ourPlayers].sort((a, b) => {
    const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });
  sorted.forEach(p => {
    const tag = document.createElement('span');
    tag.className = 'role-tag';
    tag.textContent = p.id;
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = '130';
    slider.max = '180';
    slider.step = '1';
    slider.value = p.heightCm ?? defaultHeightFor(p.id);
    slider.dataset.playerId = p.id;
    slider.className = 'slider';
    const val = document.createElement('span');
    val.className = 'h-val';
    val.textContent = `${slider.value}cm`;
    slider.addEventListener('input', (e) => {
      const newH = parseInt(e.target.value, 10);
      val.textContent = `${newH}cm`;
      const player = pattern.ourPlayers.find(x => x.id === p.id);
      if (player) player.heightCm = newH;
      if (window._volleySave) window._volleySave();
      rebuildSceneFromCurrent();
    });
    heightsGrid.appendChild(tag);
    heightsGrid.appendChild(slider);
    heightsGrid.appendChild(val);
  });
  // Reset row
  const reset = document.createElement('button');
  reset.className = 'cam-preset h-reset';
  reset.textContent = '標準にもどす(L/R 160 · C/S 155 · LB 150 · RB 145)';
  reset.addEventListener('click', () => {
    pattern.ourPlayers.forEach(p => { p.heightCm = defaultHeightFor(p.id); });
    if (window._volleySave) window._volleySave();
    renderHeightsPanel(pattern);
    rebuildSceneFromCurrent();
  });
  heightsGrid.appendChild(reset);
}

function syncArcSliderToCourse(courseIdx, pattern) {
  const c = pattern.courses[courseIdx];
  if (!c) {
    arcSlider.disabled = true;
    arcSlider.value = 0;
    arcVal.textContent = '— —';
    return;
  }
  const arc = (typeof c.arcHeight === 'number') ? c.arcHeight : (DEFAULT_ARC[c.type] ?? 0);
  arcSlider.disabled = false;
  arcSlider.value = arc;
  arcVal.textContent = arc.toFixed(2) + ' m';
}

ballHeightSlider.addEventListener('input', (e) => {
  if (currentIdx < 0) return;
  const state = window._volleyState();
  const pattern = state.patterns[currentIdx];
  const h = parseFloat(e.target.value);
  pattern.ball.h = h;
  ballHeightVal.textContent = h.toFixed(2) + ' m';
  // Persist via the shared saveState (it's a global function on window)
  if (window._volleySave) window._volleySave();
  // Rebuild scene to update ball height + recalculate trajectories
  rebuildSceneFromCurrent();
});

courseSelect.addEventListener('change', (e) => {
  if (currentIdx < 0) return;
  const state = window._volleyState();
  const pattern = state.patterns[currentIdx];
  const idx = parseInt(e.target.value, 10);
  syncArcSliderToCourse(idx, pattern);
  highlightSelectedCourse(isNaN(idx) ? -1 : idx);
});

arcSlider.addEventListener('input', (e) => {
  if (currentIdx < 0) return;
  const state = window._volleyState();
  const pattern = state.patterns[currentIdx];
  const courseIdx = parseInt(courseSelect.value, 10);
  if (courseIdx < 0 || !pattern.courses[courseIdx]) return;
  const arc = parseFloat(e.target.value);
  pattern.courses[courseIdx].arcHeight = arc;
  arcVal.textContent = arc.toFixed(2) + ' m';
  if (window._volleySave) window._volleySave();
  rebuildSceneFromCurrent();
});

function rebuildSceneFromCurrent() {
  if (currentIdx < 0) return;
  const state = window._volleyState();
  const pattern = state.patterns[currentIdx];
  // Save current camera position so user doesn't lose their angle
  const savedPos = camera ? camera.position.clone() : null;
  const savedTarget = controls ? controls.target.clone() : null;
  buildScene(pattern);
  if (savedPos && camera) camera.position.copy(savedPos);
  if (savedTarget && controls) controls.target.copy(savedTarget);
  if (controls) controls.update();
  // buildScene -> cleanupScene cancels the animation loop. Restart it.
  if (!animationId) animate();
  // Re-apply selected course highlight
  const selIdx = parseInt(courseSelect.value, 10);
  if (!isNaN(selIdx)) highlightSelectedCourse(selIdx);
}

// ---------- ENTRY ----------
function open3D(idx) {
  const state = window._volleyState();
  const pattern = state.patterns[idx];
  if (!pattern) return;
  currentIdx = idx;

  patternNameEl.textContent = `${String(idx + 1).padStart(2, '0')} · ${pattern.title}`;
  overlay.classList.add('show');

  // Build after overlay is visible (so canvas size is correct)
  requestAnimationFrame(() => {
    buildScene(pattern);
    applyCameraPreset('overhead', pattern);
    initSliders(pattern);
    renderHeightsPanel(pattern);
    animate();
  });
}

function close3D() {
  overlay.classList.remove('show');
  cleanupScene();
  currentIdx = -1;
  // Refresh 2D so any height/arc changes from 3D are reflected on the cards
  if (window._volleyRenderAll) window._volleyRenderAll();
}

// Wire close button
btnExit.addEventListener('click', close3D);

// Escape key closes
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && overlay.classList.contains('show')) {
    close3D();
  }
});

// Camera preset buttons
document.querySelectorAll('.cam-preset').forEach(btn => {
  btn.addEventListener('click', () => {
    if (currentIdx < 0) return;
    const state = window._volleyState();
    const pattern = state.patterns[currentIdx];
    applyCameraPreset(btn.dataset.cam, pattern);
  });
});

// Expose
window._open3DViewImpl = open3D;

// Process any pending open
if (window._pending3DOpen !== null && window._pending3DOpen !== undefined) {
  const idx = window._pending3DOpen;
  window._pending3DOpen = null;
  open3D(idx);
}
</script>
